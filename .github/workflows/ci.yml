name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore DeltaTrack.slnx

      - name: Build
        run: dotnet build DeltaTrack.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DeltaTrack.slnx -c Release --no-build --no-restore --verbosity normal
